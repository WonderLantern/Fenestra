name: source-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-host.txt
      - run: python -B -m unittest discover -s tests -v
      - name: AArch64 Linux helper build
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          python -B host/build_linux_overlay.py --output-dir build/linux-overlay-aarch64
      - name: Linux VFS substitution
        if: runner.os == 'Linux'
        run: sudo env FENESTRA_TEST_MOUNTS=1 unshare --mount --propagation private "$(command -v python)" -B -m unittest discover -s tests -p test_linux_file_overlay.py -v
