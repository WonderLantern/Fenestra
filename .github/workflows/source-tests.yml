name: source-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux AArch64 fixture toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld qemu-system-arm
      - run: python -m pip install -r requirements.txt -r requirements-host.txt
      - run: python -B -m unittest discover -s tests -v
        env:
          FX_QEMU: /usr/bin/qemu-system-aarch64
      - name: Z8 session runner legs
        if: runner.os == 'Linux'
        run: python tests/run_z8_session.py --output build/ci-session --qemu /usr/bin/qemu-system-aarch64
